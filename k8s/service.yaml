apiVersion: v1
kind: Service
metadata:
  name: boveda
spec:
  selector: { app: boveda }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: boveda
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/proxy-body-size: 2m
spec:
  ingressClassName: nginx
  tls:
    - hosts: [notas.example.com]
      secretName: boveda-tls
  rules:
    - host: notas.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: boveda, port: { name: http } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: boveda
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: boveda }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: boveda
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: boveda }
