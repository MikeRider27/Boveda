apiVersion: apps/v1
kind: Deployment
metadata:
  name: boveda
  labels: { app: boveda }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: boveda }
  template:
    metadata:
      labels: { app: boveda }
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: boveda }
      containers:
        - name: app
          image: ghcr.io/OWNER/boveda:latest # sustituir por el tag inmutable (SHA) en cada despliegue
          ports:
            - { name: http, containerPort: 3000 }
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: boveda-secrets, key: database-url }
            - { name: TRUST_PROXY, value: "1" }
            - { name: DB_POOL_MAX, value: "10" }
          resources:
            requests: { cpu: 100m, memory: 160Mi }
            limits: { memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
            failureThreshold: 3
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 60
          lifecycle:
            # Da tiempo al balanceador a retirar el pod antes de dejar de aceptar conexiones.
            preStop:
              sleep: { seconds: 5 }
