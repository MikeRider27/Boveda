# Entorno local completo: docker compose up --build  →  http://localhost:3000
name: boveda

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: boveda
      POSTGRES_USER: boveda
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env (ver .env.example)}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boveda -d boveda"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Sin puertos publicados: solo la app accede a Postgres por la red interna.

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://boveda:${POSTGRES_PASSWORD}@db:5432/boveda
      # Local por http: en producción (https) déjalo sin definir.
      COOKIE_SECURE: "false"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

volumes:
  pgdata:
